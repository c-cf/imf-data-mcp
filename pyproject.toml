[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imf-data-mcp"
version = "0.1.0"
description = "MCP server for the IMF public data API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.1",
    "requests>=2.32.3",
]

[project.scripts]
imf-data-mcp = "imf_data_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
